name: Feature proposal
description: Propose a concrete new feature or improvement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. Describe the problem before the solution: a clear problem statement makes an idea much easier to evaluate.

        Still shaping the idea, asking a question, or reviewing the DSP? Start in [Discussions](https://github.com/GerMP21/Corrosion-VST/discussions) instead. Any change that isn't small should be discussed there first; this form is the next step once the idea has a shape.

        Significant changes then go through the [planning process](https://github.com/GerMP21/Corrosion-VST/blob/main/CONTRIBUTING.md#planning-significant-changes). Corrosion is maintained in limited time, so replies may take a while.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues, pull requests and Discussions, and this hasn't been proposed yet.
          required: true
        - label: I checked the planned work (`docs/BACKLOG.md`, which lists deferred features, and the open changes in `openspec/changes/`).
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sound engine (exciters, objects, resonators)
        - Post chain and effects
        - Modulation and expression
        - Presets and drum kits
        - Editor (GUI)
        - Host integration (MIDI, automation, saved state)
        - Web app
        - Wiki
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the need, not the solution. What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: Who does it affect?
      description: Which users or use cases, and how often the problem comes up.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd solve it, described as behaviour (what you'd hear, see or control). Implementation details can come later, in the planning artifact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered, including current workarounds, and why you prefer your proposal.
  - type: textarea
    id: existing
    attributes:
      label: What already exists
      description: Related controls, features, specs or OpenSpec changes in the repository that this builds on or affects, if you know of any.
  - type: input
    id: discussion
    attributes:
      label: Related discussion
      description: A link to the discussion where the idea took shape, if there is one.
  - type: dropdown
    id: implementation
    attributes:
      label: Would you like to implement it?
      options:
        - Yes, I'd like to implement it
        - Maybe, with some guidance
        - No, I'm only suggesting it
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Audio examples, mockups, examples from other instruments, links, or anything else that might help.
